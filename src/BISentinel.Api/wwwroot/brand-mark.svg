<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <style>
    .brand-signal { stroke-dashoffset: 24; animation: brand-signal-draw 3.2s ease-in-out infinite; }
    .brand-spark { transform-box: fill-box; transform-origin: center; animation: brand-spark-pulse 2.4s ease-in-out infinite; }
    .brand-bars { transform-box: fill-box; transform-origin: center bottom; animation: brand-bars-rise 3.6s ease-in-out infinite alternate; }
    @keyframes brand-signal-draw { 0%, 14% { stroke-dashoffset: 24; } 52%, 100% { stroke-dashoffset: 0; } }
    @keyframes brand-spark-pulse { 0%, 100% { opacity: .7; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.22); } }
    @keyframes brand-bars-rise { from { transform: scaleY(.94); } to { transform: scaleY(1.04); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="brand-shield" x1="5" y1="4" x2="43" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43C8C0"/>
      <stop offset="1" stop-color="#3278DD"/>
    </linearGradient>
    <linearGradient id="brand-chart" x1="15" y1="18" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#D9F5F5"/>
    </linearGradient>
  </defs>
  <path d="M24 3.5 42 10v12c0 11.6-7.5 19.7-18 23-10.5-3.3-18-11.4-18-23V10l18-6.5Z" fill="#122B49" stroke="url(#brand-shield)" stroke-width="2.4"/>
  <path d="M14.5 33V25h5v8h-5Zm8 0V19h5v14h-5Zm8 0v-5h5v5h-5Z" fill="url(#brand-chart)" class="brand-bars"/>
  <path d="m15.5 22 7-5 5 2 7-7" stroke="#64E0D0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" stroke-dasharray="24" class="brand-signal"/>
  <circle cx="34.5" cy="12" r="2.5" fill="#A2FFF0" class="brand-spark"/>
</svg>
